<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar" aria-label="Main navigation">
      <div class="nav-brand">TaskFlow</div>
      <div class="nav-links">
        <a href="#" class="active" data-filter="all">Home</a>
        <a href="#" data-filter="active">Today</a>
        <a href="#" data-filter="completed">Completed</a>
      </div>
    </nav>

    <main class="app">
      <section class="todo-card">
        <header class="header">
          <p class="eyebrow">Daily planner</p>
          <h1>To-Do List</h1>
        </header>

        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Add a task</label>
          <input
            id="todo-input"
            type="text"
            name="todo"
            placeholder="Add a new task..."
            maxlength="120"
            autocomplete="off"
          />
          <button type="submit">Add</button>
        </form>

        <div class="toolbar" aria-label="Task controls">
          <div class="filters" role="tablist" aria-label="Filter tasks">
            <button class="filter active" data-filter="all" type="button">All</button>
            <button class="filter" data-filter="active" type="button">Active</button>
            <button class="filter" data-filter="completed" type="button">Completed</button>
          </div>

          <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <footer class="status-bar">
          <span id="task-count">0 tasks</span>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
